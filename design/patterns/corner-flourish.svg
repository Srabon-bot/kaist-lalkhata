        fill="none" stroke="#9e2a2b" stroke-width="4.5" stroke-linecap="round" />
  <path d="M18,18 C55,30 76,54 78,86"
        fill="none" stroke="#7a1512" stroke-width="2.2" stroke-linecap="round" />

