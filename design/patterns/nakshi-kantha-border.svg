<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70">
  <!-- Nakshi kantha: Bengali quilt embroidery built from running stitches.
       Bolder wave with clearly-visible cross-stitches along it, and a
       straight guide-stitch line above/below like a real kantha border. -->
  <defs>
    <pattern id="kanthaUnit" width="80" height="70" patternUnits="userSpaceOnUse">
      <line x1="0" y1="10" x2="80" y2="10" stroke="#7a1512" stroke-width="1.5" stroke-dasharray="6 5" />
      <path d="M0,40 Q20,20 40,40 T80,40" fill="none" stroke="#9e2a2b"
            stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="60" x2="80" y2="60" stroke="#7a1512" stroke-width="1.5" stroke-dasharray="6 5" />
      <g stroke="#2e7d4f" stroke-width="2.5" stroke-linecap="round">
        <line x1="17" y1="33" x2="23" y2="43" />
        <line x1="23" y1="33" x2="17" y2="43" />
      </g>
      <g stroke="#985200" stroke-width="2.5" stroke-linecap="round">
        <line x1="57" y1="33" x2="63" y2="43" />
        <line x1="63" y1="33" x2="57" y2="43" />
      </g>
    </pattern>
  </defs>
  <rect width="1200" height="70" fill="url(#kanthaUnit)" />
</svg>
